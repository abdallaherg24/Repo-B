name: vps-relay

on:
  workflow_dispatch:
    inputs:
      receive:
        description: "استقبل الملفات من الجهاز التاني"
        required: false
        default: "false"
  schedule:
    - cron: '*/15 * * * *'

env:
  MY_NAME: vps-b
  PEER_NAME: vps-a
  PEER_REPO: abdallaherg24/Repo-A
  PEER_BRANCH: main
  START_CMD: "python3 main.py"
  HANDOFF_MIN: "300"
  LAST_MIN: "355"
  OVERLAP_SEC: "180"
  READY_WAIT_SEC: "420"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: حارس يمنع تكرار التشغيل
        id: guard
        if: github.event_name == 'schedule'
        env:
          PAT: ${{ secrets.PAT }}
          GHT: ${{ github.token }}
        run: |
          count() {
            n=$(curl -s -H "Authorization: Bearer $1" \
              "https://api.github.com/repos/$2/actions/runs?status=$3" | jq '.total_count // 0' 2>/dev/null)
            echo "${n:-0}"
          }
          me=$(( $(count "$GHT" "${{ github.repository }}" in_progress) + $(count "$GHT" "${{ github.repository }}" queued) ))
          peer=$(( $(count "$PAT" "$PEER_REPO" in_progress) + $(count "$PAT" "$PEER_REPO" queued) ))
          echo "me=$me peer=$peer"
          if [ "$me" -gt 1 ] || [ "$peer" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "فيه سلسلة شغالة، هخرج."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: استرجاع وفك تشفير جلسات فيسبوك وانستجرام من السيكرتس
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p data
          echo "${{ secrets.FB_STATE_JSON }}" | base64 -d > data/fb_state.json
          echo "${{ secrets.IG_STATE_JSON }}" | base64 -d > data/ig_state.json
          echo "تم فك تشفير واسترجاع ملفات الجلسات بنجاح في مجلد data"

      - name: علّم وقت البداية
        if: steps.guard.outputs.skip != 'true'
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: اتصل بشبكة Tailscale
        if: steps.guard.outputs.skip != 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: ${{ env.MY_NAME }}
          args: --ssh

      - name: استقبل الملفات من الجهاز القديم
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.receive == 'true'
        run: |
          sudo apt-get install -y -qq netcat-openbsd jq > /dev/null
          mkdir -p data
          echo "بستنى الملفات (لحد 15 دقيقة)..."
          timeout 900 nc -l 9000 | tar xzf - || echo "مفيش ملفات اتبعتت"
          ls -la data

      - name: تثبيت الاعتمادات وتشغيل الخدمة
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install --upgrade pip
          pip install streamlink playwright TikTokLive
          playwright install --with-deps chromium
          
          setsid nohup $START_CMD > out.log 2>&1 &

          sleep 15
          if pgrep -f "$START_CMD" > /dev/null; then
            mkdir -p /tmp/ready && echo ok > /tmp/ready/ready
            setsid nohup python3 -m http.server 9001 --directory /tmp/ready > /dev/null 2>&1 &
            echo "البث شغال فعلاً، الجهاز جاهز"
          else
            echo "البث ما اشتغلش، راجع out.log"
            cat out.log || true
            exit 1
          fi

      - name: سلّم للجهاز التاني
        if: steps.guard.outputs.skip != 'true'
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          sudo apt-get install -y -qq netcat-openbsd jq > /dev/null
          elapsed() { echo $(( $(date +%s) - JOB_START )); }

          peer_runs() {
            for s in in_progress queued; do
              curl -s -H "Authorization: Bearer $PAT" \
                "https://api.github.com/repos/$PEER_REPO/actions/runs?status=$s" | jq '.total_count // 0'
            done | awk '{n+=$1} END{print n+0}'
          }

          dispatch() {
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$PEER_REPO/actions/workflows/run.yml/dispatches" \
              -d "{\"ref\":\"$PEER_BRANCH\",\"inputs\":{\"receive\":\"true\"}}"
          }

          discover() {
            sudo tailscale status --json | jq -r --arg n "$PEER_NAME" \
              '[.Peer[]? | select(.Online==true) | select(.HostName|test("^"+$n+"(-[0-9]+)?$"))] | sort_by(.Created) | last | .TailscaleIPs[0] // empty'
          }

          wait=$(( HANDOFF_MIN*60 - $(elapsed) ))
          [ "$wait" -gt 0 ] && sleep "$wait"

          IP=""; SENT=0; READY=0; LAST_DISPATCH=-9999
          while [ "$(elapsed)" -lt $(( LAST_MIN*60 )) ]; do
            if [ -z "$IP" ] && [ $(( $(elapsed) - LAST_DISPATCH )) -ge 300 ] && [ "$(peer_runs)" -eq 0 ]; then
              echo "dispatch -> $(dispatch)"
              LAST_DISPATCH=$(elapsed)
            fi

            [ -z "$IP" ] && IP=$(discover)

            if [ -n "$IP" ] && [ "$SENT" = 0 ]; then
              if tar czf - data | nc -N -w 30 "$IP" 9000; then SENT=1; echo "الملفات اتبعتت"; fi
            fi

            if [ -n "$IP" ] && curl -sf --max-time 5 "http://$IP:9001/ready" > /dev/null; then
              READY=1; break
            fi
            sleep 10
          done

          if [ "$READY" = 1 ]; then
            echo "التاني بيبث فعلاً. الاتنين شغالين مع بعض ${OVERLAP_SEC} ثانية"
            sleep "$OVERLAP_SEC"
            pkill -f "$START_CMD" || true
            pkill -x ffmpeg || true
            echo "الجهاز ده وقف، والتاني كمل"
          else
            echo "تحذير: التاني ما بدأش يبث قبل الحد الأقصى. هفضل شغال لآخر لحظة."
            rest=$(( 357*60 - $(elapsed) ))
            [ "$rest" -gt 0 ] && sleep "$rest"
          fi
