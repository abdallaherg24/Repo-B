name: vps-relay

on:
  workflow_dispatch:
    inputs:
      receive:
        description: "استقبل الملفات من الجهاز الثاني"
        required: false
        default: "false"
  schedule:
    - cron: '10,25,40,55 * * * *'

env:
  MY_NAME: vps-b
  PEER_NAME: vps-a
  PEER_REPO: abdallaherg24/Repo-A
  PEER_BRANCH: main
  WORKFLOW_FILE: run.yml
  START_CMD: "python3 main.py"
  HANDOFF_MIN: "300"
  FORCE_HANDOFF_MIN: "315"
  LAST_MIN: "355"
  OVERLAP_SEC: "180"

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - name: حارس يمنع تكرار التشغيل
        id: g
        env:
          PAT: ${{ secrets.PAT }}
          GHT: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            count() {
              n=$(curl -s -H "Authorization: Bearer $1" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$2/actions/runs?status=$3&per_page=1" | jq '.total_count // 0' 2>/dev/null)
              echo "${n:-0}"
            }
            me=$(( $(count "$GHT" "$GITHUB_REPOSITORY" in_progress) + $(count "$GHT" "$GITHUB_REPOSITORY" queued) ))
            peer=$(( $(count "$PAT" "$PEER_REPO" in_progress) + $(count "$PAT" "$PEER_REPO" queued) ))
            echo "me=$me peer=$peer"
            if [ "$me" -gt 1 ] || [ "$peer" -gt 0 ]; then
              skip=true
              echo "فيه سلسلة شغالة، هخرج"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  run:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: علم وقت البداية
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت Deno (لحل تحديات يوتيوب)
        uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x

      - name: تثبيت الاعتمادات والأدوات (curl-cffi مهم جداً)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg netcat-openbsd jq curl git > /dev/null
          python3 -m pip install -q -U --break-system-packages flask flask-cors waitress requests
          python3 -m pip install -q -U --break-system-packages --pre "yt-dlp[default,curl-cffi]" \
            || python3 -m pip install -q -U --break-system-packages "yt-dlp[default,curl-cffi]"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          yt-dlp --version

      - name: مزوّد PO Token (لتقليل الحظر)
        continue-on-error: true
        run: |
          set +eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m pip install -q -U --break-system-packages bgutil-ytdlp-pot-provider || exit 0
          V=$(python3 -m pip show bgutil-ytdlp-pot-provider | awk '/^Version:/{print $2}')
          git clone -q --depth 1 --single-branch --branch "$V" https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil" || exit 0
          cd "$HOME/bgutil/server" || exit 0
          npm ci --silent && npx tsc || exit 0
          setsid nohup node build/main.js > "$HOME/bgutil.log" 2>&1 &
          sleep 4
          curl -s --max-time 5 http://127.0.0.1:4416/ping || echo "bgutil لم يبدأ"

      - name: اتصل بشبكة Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: ${{ env.MY_NAME }}
          args: --ssh

      - name: استقبل الملفات من الجهاز الثاني
        if: github.event.inputs.receive == 'true'
        run: |
          mkdir -p data
          timeout 900 nc -l 9000 | tar xf - || echo "مفيش ملفات اتبعتت"

      - name: شغل الخدمة + سجل الرابط في Cloudflare KV + سلّم للجهاز الثاني
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          PAT: ${{ secrets.PAT }}
          DIRECT_LANE: "1"
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p data
          elapsed() { echo $(( $(date +%s) - JOB_START )); }
          health() { curl -s --max-time 5 http://127.0.0.1:8090/api/health; }

          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb > /dev/null 2>&1; rm -f cloudflared.deb
          cloudflared --version

          start_service() {
            pkill -f "$START_CMD" 2>/dev/null
            setsid nohup $START_CMD > out.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:8090/api/health > /dev/null && return 0
              sleep 1
            done
            echo "الخدمة لم تبدأ، آخر سطور اللوج:"; tail -n 30 out.log
            return 1
          }

          start_tunnel() {
            pkill -f "cloudflared tunnel" 2>/dev/null
            : > tunnel.log
            setsid nohup cloudflared tunnel --url http://127.0.0.1:8090 --no-autoupdate --edge-ip-version 4 > tunnel.log 2>&1 &
            TUNNEL_URL=""
            for i in $(seq 1 40); do
              TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | grep -v '^https://api\.' | head -1)
              [ -n "$TUNNEL_URL" ] && return 0
              sleep 2
            done
            return 1
          }

          wait_tunnel_ready() {
            for i in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$TUNNEL_URL/api/health")
              [ "$code" = "200" ] && return 0
              sleep 2
            done
            return 1
          }

          publish_url() {
            API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_ID/values"
            OLD=$(curl -s --max-time 20 -H "Authorization: Bearer $CF_API_TOKEN" "$API/current")
            case "$OLD" in
              https://*)
                if [ "$OLD" != "$TUNNEL_URL" ]; then
                  curl -s --max-time 20 -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -F "value=$OLD" "$API/previous" | jq -c '{success,errors}'
                fi ;;
            esac
            RES=$(curl -s --max-time 20 -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -F "value=$TUNNEL_URL" "$API/current")
            echo "$RES" | jq -c '{success,errors}' 2>/dev/null || echo "$RES"
            [ "$(echo "$RES" | jq -r '.success' 2>/dev/null)" = "true" ]
          }

          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_KV_ID" ]; then
            echo "::error::أحد secrets الخاصة بـ Cloudflare فاضي (CF_API_TOKEN / CF_ACCOUNT_ID / CF_KV_ID)"
          fi

          start_service || exit 1
          start_tunnel || { echo "::error::cloudflared لم يعطِ رابط"; tail -n 30 tunnel.log; exit 1; }
          echo "Tunnel URL: $TUNNEL_URL"
          wait_tunnel_ready || echo "::warning::الرابط لم يرد خلال المهلة، سننشره على أي حال"

          for i in $(seq 1 75); do
            [ "$(health | jq -r '.preflight // empty')" = "done" ] && break
            sleep 2
          done
          echo "health: $(health)"

          published=0
          for n in 1 2 3; do
            if publish_url; then published=1; break; fi
            sleep 5
          done
          if [ "$published" = 1 ]; then
            echo "تم تحديث الرابط في Cloudflare KV بنجاح"
          else
            echo "::error::فشل الكتابة في KV. راجع صلاحية التوكن (Workers KV Storage: Edit) و CF_KV_ID و CF_ACCOUNT_ID"
          fi

          mkdir -p /tmp/ready && echo ok > /tmp/ready/ready
          setsid nohup python3 -m http.server 9001 --directory /tmp/ready > /dev/null 2>&1 &

          peer_runs() {
            for s in in_progress queued; do
              curl -s -H "Authorization: Bearer $PAT" "https://api.github.com/repos/$PEER_REPO/actions/runs?status=$s&per_page=1" | jq '.total_count // 0'
            done | awk '{n+=$1} END{print n+0}'
          }
          dispatch() {
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$PEER_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
              -d "{\"ref\":\"$PEER_BRANCH\",\"inputs\":{\"receive\":\"true\"}}"
          }
          discover() {
            sudo tailscale status --json | jq -r --arg n "$PEER_NAME" \
              '[.Peer[]? | select(.Online==true) | select(.HostName | test("^"+$n+"(-[0-9]+)?$"))] | sort_by(.Created) | last | .TailscaleIPs[0] // empty'
          }

          fails=0
          while [ "$(elapsed)" -lt $((HANDOFF_MIN*60)) ]; do
            if [ -n "$(health)" ]; then fails=0; else fails=$((fails+1)); fi
            if [ "$fails" -ge 3 ]; then
              echo "الخدمة واقفة، إعادة تشغيل..."; start_service; fails=0
            fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              echo "الـ tunnel وقع، إعادة تشغيل ونشر رابط جديد..."
              if start_tunnel && wait_tunnel_ready; then publish_url; fi
            fi
            sleep 20
          done

          while [ "$(elapsed)" -lt $((FORCE_HANDOFF_MIN*60)) ]; do
            running=$(health | jq -r '.running // 0')
            if [ "${running:-0}" = "0" ]; then break; fi
            echo "في $running تحميل شغال، بنستنى قبل التسليم..."
            sleep 20
          done

          IP=""; SENT=0; READY=0; LAST_DISPATCH=-9999
          while [ "$(elapsed)" -lt $((LAST_MIN*60)) ]; do
            if [ -z "$IP" ] && [ $(( $(elapsed) - LAST_DISPATCH )) -ge 300 ] && [ "$(peer_runs)" -eq 0 ]; then
              code=$(dispatch); echo "dispatch http=$code"
              LAST_DISPATCH=$(elapsed)
            fi
            [ -z "$IP" ] && IP=$(discover)
            if [ -n "$IP" ] && [ "$SENT" = 0 ]; then
              if tar cf - data | nc -N -w 30 "$IP" 9000; then SENT=1; echo "تم إرسال البيانات"; fi
            fi
            if [ -n "$IP" ] && curl -sf --max-time 5 "http://$IP:9001/ready" > /dev/null; then
              READY=1; break
            fi
            sleep 10
          done

          if [ "$READY" = 1 ]; then
            echo "الجهاز الثاني جاهز. تداخل ${OVERLAP_SEC} ثانية ثم إيقاف هذا السيرفر"
            sleep "$OVERLAP_SEC"
            pkill -f "$START_CMD"
            sleep 30
          else
            echo "الجهاز الثاني لم يجهز، هنكمل خدمة لحد نهاية المدة"
            while [ "$(elapsed)" -lt $((357*60)) ]; do sleep 20; done
          fi
          exit 0
