export default {
  async fetch(request, env) {
    let currentUrl = await env.KV.get("current");
    let previousUrl = await env.KV.get("previous");

    // الدعم الكامل لطلبات CORS المسبقة لحل خطأ 500 في واجهة الموقع
    if (request.method === "OPTIONS") {
      return new Response(null, {
        status: 204,
        headers: {
          "Access-Control-Allow-Origin": "*",
          "Access-Control-Allow-Methods": "GET, POST, OPTIONS, PUT, DELETE",
          "Access-Control-Allow-Headers": "Content-Type, Authorization",
        }
      });
    }

    if (!currentUrl && !previousUrl) {
      return new Response("السيرفر بيتبدل، جرب تاني بعد ثواني", {
        status: 503,
        headers: { "content-type": "text/html; charset=utf-8", "Access-Control-Allow-Origin": "*" }
      });
    }

    const url = new URL(request.url);

    async function proxyRequest(baseUrl) {
      const targetUrl = new URL(url.pathname + url.search, baseUrl);
      const newHeaders = new Headers(request.headers);
      newHeaders.set("Host", new URL(baseUrl).host);

      let response = await fetch(targetUrl, {
        method: request.method,
        headers: newHeaders,
        body: ["GET", "HEAD"].includes(request.method) ? null : request.body,
        redirect: "follow"
      });

      let newResponse = new Response(response.body, response);
      newResponse.headers.set("Access-Control-Allow-Origin", "*");
      return newResponse;
    }

    if (currentUrl) {
      try {
        let res = await proxyRequest(currentUrl);
        if (res.status !== 502 && res.status !== 504 && res.status !== 524) return res;
      } catch (e) {}
    }

    if (previousUrl) {
      try {
        let res = await proxyRequest(previousUrl);
        return res;
      } catch (e) {}
    }

    return new Response("السيرفر بيتبدل، جرب تاني بعد ثواني", {
      status: 503,
      headers: { "content-type": "text/html; charset=utf-8", "Access-Control-Allow-Origin": "*" }
    });
  }
};
