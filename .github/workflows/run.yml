name: vps-relay

on:
  workflow_dispatch:
    inputs:
      receive:
        description: "استقبل الملفات من الجهاز الثاني"
        required: false
        default: "false"
  schedule:
    - cron: '*/15 * * * *'

env:
  MY_NAME: vps-b
  PEER_NAME: vps-a
  PEER_REPO: abdallaherg24/Repo-A
  PEER_BRANCH: main
  WORKFLOW_FILE: vps-relay.yml
  START_CMD: "python3 main.py"
  HANDOFF_MIN: "300"
  LAST_MIN: "355"
  OVERLAP_SEC: "180"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: حارس يمنع تكرار التشغيل
        id: guard
        if: github.event_name == 'schedule'
        env:
          PAT: ${{ secrets.PAT }}
          GHT: ${{ github.token }}
        run: |
          count() {
            n=$(curl -s -H "Authorization: Bearer $1" \
              "https://api.github.com/repos/$2/actions/runs?status=$3" | jq '.total_count // 0' 2>/dev/null)
            echo "${n:-0}"
          }
          me=$(($(count "$GHT" "${{ github.repository }}" in_progress) + $(count "$GHT" "${{ github.repository }}" queued)))
          peer=$(($(count "$PAT" "$PEER_REPO" in_progress) + $(count "$PAT" "$PEER_REPO" queued)))
          echo "me=$me peer=$peer"
          if [ "$me" -gt 1 ] || [ "$peer" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "فيه سلسلة شغالة، هخرج"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: تثبيت الاعتمادات والأدوات
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg netcat-openbsd jq python3-pip > /dev/null
          pip3 install -U "yt-dlp[default]" flask requests --break-system-packages || pip3 install -U "yt-dlp[default]" flask requests

      - name: تثبيت وتفعيل Cloudflare WARP
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y cloudflare-warp
          warp-cli registration new || true
          warp-cli mode warp+doh || true
          warp-cli connect || true
          sleep 3

      - name: علم وقت البداية
        if: steps.guard.outputs.skip != 'true'
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: اتصل بشبكة Tailscale
        if: steps.guard.outputs.skip != 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: ${{ env.MY_NAME }}
          args: --ssh

      - name: استقبل الملفات من الجهاز الثاني
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.receive == 'true'
        run: |
          mkdir -p data
          timeout 900 nc -l 9000 | tar xzf - || echo "مفيش ملفات اتبعتت"

      - name: شغل الخدمة وسجل الرابط في Cloudflare Worker
        if: steps.guard.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: |
          mkdir -p data
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

          setsid nohup $START_CMD > out.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8090/api/jobs > /dev/null && break
            sleep 1
          done

          URL=""
          for attempt in $(seq 1 3); do
            pkill -f cloudflared || true
            setsid nohup cloudflared tunnel --url http://127.0.0.1:8090 --no-autoupdate > tunnel.log 2>&1 &
            for i in $(seq 1 20); do
              URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | grep -v '^https://api\.' | head -1)
              [ -n "$URL" ] && break 2
              sleep 2
            done
          done
          
          echo "Tunnel URL: $URL"

          if [ -n "$URL" ]; then
            API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_ID/values"
            OLD=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "$API/current")
            case "$OLD" in
              https://*) curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: text/plain" --data "$OLD" "$API/previous" > /dev/null ;;
            esac
            curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: text/plain" --data "$URL" "$API/current"
            echo "تم تحديث الرابط في Cloudflare KV بنجاح"
          fi

          mkdir -p /tmp/ready && echo ok > /tmp/ready/ready
          setsid nohup python3 -m http.server 9001 --directory /tmp/ready > /dev/null 2>&1 &

      - name: سلم للجهاز الثاني وانقل البيانات
        if: steps.guard.outputs.skip != 'true'
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          elapsed() { echo $(($(date +%s) - JOB_START)); }
          peer_runs() {
            for s in in_progress queued; do
              curl -s -H "Authorization: Bearer $PAT" \
                "https://api.github.com/repos/$PEER_REPO/actions/runs?status=$s" | jq '.total_count // 0'
            done | awk '{n+=$1} END{print n+0}'
          }
          dispatch() {
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$PEER_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
              -d "{\"ref\":\"$PEER_BRANCH\",\"inputs\":{\"receive\":\"true\"}}"
          }
          discover() {
            sudo tailscale status --json | jq -r --arg n "$PEER_NAME" \
              '[.Peer[]? | select(.Online==true) | select(.HostName | test("^"+$n+"(-[0-9]+)?$"))] | sort_by(.Created) | last | .TailscaleIPs[0] // empty'
          }
          wait=$((HANDOFF_MIN*60 - $(elapsed)))
          [ "$wait" -gt 0 ] && sleep "$wait"
          IP=""; SENT=0; READY=0; LAST_DISPATCH=-9999
          while [ "$(elapsed)" -lt $((LAST_MIN*60)) ]; do
            if [ -z "$IP" ] && [ $(($(elapsed) - LAST_DISPATCH)) -ge 300 ] && [ "$(peer_runs)" -eq 0 ]; then
              dispatch
              LAST_DISPATCH=$(elapsed)
            fi
            [ -z "$IP" ] && IP=$(discover)
            if [ -n "$IP" ] && [ "$SENT" = 0 ]; then
              if tar czf - data | nc -N -w 30 "$IP" 9000; then SENT=1; fi
            fi
            if [ -n "$IP" ] && curl -sf --max-time 5 "http://$IP:9001/ready" > /dev/null; then
              READY=1; break
            fi
            sleep 10
          done
          if [ "$READY" = 1 ]; then
            sleep "$OVERLAP_SEC"
            pkill -f "$START_CMD" || true
          fi
          rest=$((357*60 - $(elapsed)))
          [ "$rest" -gt 0 ] && sleep "$rest"
